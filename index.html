<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <style>
        :root { --bg: #020202; --grid: #111; --snake: #22c55e; --food: #ef4444; --text: #fff; --pad: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .header { 
            display: flex; justify-content: space-between; width: 90vmin; max-width: 400px;
            margin-bottom: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.9rem;
        }
        canvas { 
            background: var(--grid); border: 1px solid #333; box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
            border-radius: 4px;
        }
        .controls {
            display: none; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(2, 80px); 
            gap: 10px; margin-top: 2rem; justify-content: center;
        }
        @media (max-width: 768px) { .controls { display: grid; } }
        .d-pad { 
            background: var(--pad); border: 1px solid #333; color: #666; font-size: 2rem;
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 0 #000; transition: all 0.1s;
        }
        .d-pad:active { transform: translateY(4px); box-shadow: 0 0 0 #000; background: var(--snake); color: var(--bg); border-color: var(--snake); }
        .up { grid-column: 2; grid-row: 1; } 
        .left { grid-column: 1; grid-row: 2; } 
        .down { grid-column: 2; grid-row: 2; } 
        .right { grid-column: 3; grid-row: 2; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(4px);
        }
        .overlay.hidden { display: none; }
        .overlay h1 { font-size: 3rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 1rem; text-align: center; }
        .btn { 
            background: var(--snake); color: var(--bg); border: none; padding: 1rem 3rem;
            font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 2rem;
            text-transform: uppercase; letter-spacing: 0.1em; border-radius: 4px;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>High: <span id="highScore">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
        <div class="d-pad up" data-dir="up">▲</div>
        <div class="d-pad left" data-dir="left">◀</div>
        <div class="d-pad down" data-dir="down">▼</div>
        <div class="d-pad right" data-dir="right">▶</div>
    </div>

    <div class="overlay" id="startScreen">
        <h1>NEON SNAKE</h1>
        <p style="color:#888; font-size: 0.9rem;">Use Arrow Keys or D-Pad</p>
        <button class="btn" onclick="game.start()">Start Game</button>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
        <h1 style="color:var(--food)">GAME OVER</h1>
        <p style="font-size:2rem; font-weight:700" id="finalScore">0</p>
        <button class="btn" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        let tileCount = 20;
        
        function resize() {
            const size = Math.min(window.innerWidth - 32, 400);
            canvas.width = size;
            canvas.height = size;
            tileCount = Math.floor(size / gridSize);
        }
        window.addEventListener('resize', resize);
        resize();

        const game = {
            snake: [{x: 10, y: 10}],
            food: {x: 15, y: 15},
            dx: 0, dy: 0,
            score: 0,
            highScore: localStorage.getItem('snake_high') || 0,
            loop: null,

            init() {
                document.getElementById('highScore').textContent = this.highScore;
                document.addEventListener('keydown', (e) => this.handleInput(e.key));
                document.querySelectorAll('.d-pad').forEach(btn => {
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.handleInput(btn.dataset.dir);
                    });
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        this.handleInput(btn.dataset.dir);
                    });
                });
            },

            start() {
                document.getElementById('startScreen').classList.add('hidden');
                this.dx = 1; this.dy = 0;
                this.loop = setInterval(this.update.bind(this), 100);
            },

            reset() {
                clearInterval(this.loop);
                this.snake = [{x: 10, y: 10}];
                this.score = 0;
                this.dx = 1; this.dy = 0;
                this.updateScore();
                document.getElementById('gameOverScreen').classList.add('hidden');
                this.start();
            },

            update() {
                const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return this.gameOver();
                if (this.snake.some(s => s.x === head.x && s.y === head.y)) return this.gameOver();
                this.snake.unshift(head);
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.updateScore();
                    this.placeFood();
                } else {
                    this.snake.pop();
                }
                this.draw();
            },

            draw() {
                ctx.fillStyle = '#020202'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444'; ctx.shadowBlur = 15; ctx.shadowColor = '#ef4444';
                ctx.fillRect(this.food.x * gridSize + 1, this.food.y * gridSize + 1, gridSize - 2, gridSize - 2);
                ctx.fillStyle = '#22c55e'; ctx.shadowColor = '#22c55e';
                this.snake.forEach((s, i) => {
                    ctx.shadowBlur = i === 0 ? 20 : 0;
                    ctx.fillRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2);
                });
                ctx.shadowBlur = 0;
            },

            placeFood() {
                this.food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                if (this.snake.some(s => s.x === this.food.x && s.y === this.food.y)) this.placeFood();
            },

            handleInput(key) {
                const dir = key.replace('Arrow', '').toLowerCase();
                if ((dir === 'up' || dir === 'w') && this.dy === 0) { this.dx = 0; this.dy = -1; }
                if ((dir === 'down' || dir === 's') && this.dy === 0) { this.dx = 0; this.dy = 1; }
                if ((dir === 'left' || dir === 'a') && this.dx === 0) { this.dx = -1; this.dy = 0; }
                if ((dir === 'right' || dir === 'd') && this.dx === 0) { this.dx = 1; this.dy = 0; }
            },

            updateScore() {
                document.getElementById('score').textContent = this.score;
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snake_high', this.highScore);
                    document.getElementById('highScore').textContent = this.highScore;
                }
            },

            gameOver() {
                clearInterval(this.loop);
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }
        };

        game.init();
    </script>
</body>
</html>
